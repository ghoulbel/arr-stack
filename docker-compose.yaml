services:
  qbittorrentvpn:
    image: binhex/arch-qbittorrentvpn:latest
    container_name: qbittorrentvpn
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Zurich
      - VPN_ENABLED=yes
      - VPN_USER=${VPN_USER}
      - VPN_PASS=${VPN_PASS}
      - VPN_PROV=custom
      - VPN_CLIENT=openvpn
      - LAN_NETWORK=192.168.1.0/24
      - WEBUI_PORT=8080
      - UMASK=000
      - DEBUG=false
    volumes:
      - ./config/qbittorrentvpn:/config
      - /mnt/synology/downloads:/data
    # Split deliberately:
    #   8080   the WebUI, where your full download history and every file on
    #           your NAS is browsable. LAN reachable on purpose - you admin
    #           it from your phone; the tunnel does not route it, so this is
    #           home-LAN only, and it still demands its own login.
    #   6881   the BitTorrent peer port, PRESERVED ON 0.0.0.0 (tcp + udp).
    #           Peers connect inbound from the internet and cannot be told to
    #           use a different port, so binding this to loopback would simply
    #           make every torrent arrive via a tracker or DHT instead, much
    #           slower. Unlike the WebUI this port exposes no data — an
    #           unsolicited packet gets a protocol rejection and nothing more.
    #
    # The VPN kills the container's own LAN access unless LAN_NETWORK covers
    # this subnet (it does, see above), which is also why the published ports
    # keep working with NET_ADMIN in play.
    ports:
      - "${QBITTORRENT_PORT:-8080}:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks:
      - media-net

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Zurich
    volumes:
      - ./config/prowlarr:/config
    # LAN reachable on purpose. You administer these from your phone and
    # laptop, and the Cloudflare tunnel deliberately does NOT route any of
    # them, so "LAN reachable" is the whole exposure: guests and IoT devices
    # on the home Wi-Fi can load the login page, nothing more. Every one of
    # these services requires its own credentials before showing any data.
    # Prowlarr's API key is the only thing between an outsider and your whole
    # indexer history, so keep that key secret.
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    restart: unless-stopped
    networks:
      - media-net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Zurich
    volumes:
      - ./config/sonarr:/config
      - /mnt/synology/downloads:/downloads
      - /mnt/synology/tv:/tv
    # LAN reachable on purpose. You administer these from your phone and
    # laptop, and the Cloudflare tunnel deliberately does NOT route any of
    # them, so "LAN reachable" is the whole exposure: guests and IoT devices
    # on the home Wi-Fi can load the login page, nothing more. Every one of
    # these services requires its own credentials before showing any data.
    ports:
      - "${SONARR_PORT:-8989}:8989"
    restart: unless-stopped
    networks:
      - media-net

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Zurich
    volumes:
      - ./config/radarr:/config
      - /mnt/synology/downloads:/downloads
      - /mnt/synology/movies:/movies
    # LAN reachable on purpose. You administer these from your phone and
    # laptop, and the Cloudflare tunnel deliberately does NOT route any of
    # them, so "LAN reachable" is the whole exposure: guests and IoT devices
    # on the home Wi-Fi can load the login page, nothing more. Every one of
    # these services requires its own credentials before showing any data.
    ports:
      - "${RADARR_PORT:-7878}:7878"
    restart: unless-stopped
    networks:
      - media-net

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Zurich
    volumes:
      - ./config/lidarr:/config
      - /mnt/synology/downloads:/downloads
      - /mnt/synology/music:/music
    # LAN reachable on purpose. You administer these from your phone and
    # laptop, and the Cloudflare tunnel deliberately does NOT route any of
    # them, so "LAN reachable" is the whole exposure: guests and IoT devices
    # on the home Wi-Fi can load the login page, nothing more. Every one of
    # these services requires its own credentials before showing any data.
    ports:
      - "${LIDARR_PORT:-8686}:8686"
    restart: unless-stopped
    networks:
      - media-net

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    gpus: all
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
      # Tell clients the address they are actually reachable on. Without this the
      # admin dashboard keeps advertising the container's own IP to anybody who
      # logs in through the web UI.
      - JELLYFIN_PublishedServerUrl=https://jellyfin.ghoulhub.uk
    volumes:
      - ./cache/jellyfin:/transcode
      - ./config/jellyfin:/config
      - /mnt/synology/tv:/media/tv
      - /mnt/synology/movies:/media/movies
      - /mnt/synology/music:/media/music
    # No host port. Traefik on the 'proxy' network is the only way in, so Jellyfin
    # cannot be reached from the LAN or from the internet while bypassing TLS,
    # the security headers and the rate limit.
    #
    # NOTE: there is deliberately NO forward-auth here, and Jellyfin is the one
    # service where the shared Authentik gate cannot be used. See the long note
    # at the end of this file before "adding" it back.
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.jellyfin.rule: Host(`jellyfin.ghoulhub.uk`)
      traefik.http.routers.jellyfin.entrypoints: "websecure"
      traefik.http.routers.jellyfin.tls: "true"
      traefik.http.routers.jellyfin.tls.certresolver: "le"
      traefik.http.routers.jellyfin.priority: "10"
      traefik.http.routers.jellyfin.middlewares: "security-headers,rate-limit"
    restart: unless-stopped
    networks:
      - media-net
      - proxy

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
    # No `ports:` at all. FlareSolverr is a headless browser used only to fetch
    # indexer pages, and nothing outside this compose file calls it (checked:
    # no config references it by host address). It is reached over media-net.
    # Publishing it meant any device on the LAN could drive a browser on this
    # host and read its output.
    restart: unless-stopped
    networks:
      - media-net

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Zurich
    volumes:
      - ./config/sabnzbd:/config
      - /mnt/synology/downloads:/downloads
    # LAN reachable on purpose. You administer these from your phone and
    # laptop, and the Cloudflare tunnel deliberately does NOT route any of
    # them, so "LAN reachable" is the whole exposure: guests and IoT devices
    # on the home Wi-Fi can load the login page, nothing more. Every one of
    # these services requires its own credentials before showing any data.
    ports:
      - "${SABNZBD_PORT:-8081}:8080"
    restart: unless-stopped
    networks:
      - media-net

  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:latest
    container_name: nzbhydra2
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
    volumes:
      - ./config/nzbhydra2:/config
    # LAN reachable on purpose. You administer these from your phone and
    # laptop, and the Cloudflare tunnel deliberately does NOT route any of
    # them, so "LAN reachable" is the whole exposure: guests and IoT devices
    # on the home Wi-Fi can load the login page, nothing more. Every one of
    # these services requires its own credentials before showing any data.
    # NZBHydra2 indexes every indexer you
    # have, which is a map of what you watch.
    ports:
      - "${NZBHYDRA_PORT:-5076}:5076"
    restart: unless-stopped
    networks:
      - media-net

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
    volumes:
      - ./config/jellyseerr:/app/config
    # No host port: this was reachable from the internet with no Authentik gate
    # at all, because the tunnel pointed straight at the published port and
    # bypassed Traefik completely. Anyone who found the hostname could add
    # anything to the library queue and trigger downloads.
    #
    # Forward-auth works here (unlike on Jellyfin) because Jellyseerr keeps a
    # normal express-session cookie. It has no native clients, so nothing else
    # depends on a token-only path.
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.jellyseerr.rule: Host(`jellyseerr.ghoulhub.uk`)
      traefik.http.routers.jellyseerr.entrypoints: "websecure"
      traefik.http.routers.jellyseerr.tls: "true"
      traefik.http.routers.jellyseerr.tls.certresolver: "le"
      traefik.http.routers.jellyseerr.priority: "10"
      traefik.http.routers.jellyseerr.middlewares: "rate-limit,security-headers,authentik-forwardauth"
      # Companion router for the Authentik OAuth callback. It must outrank the
      # router above, otherwise the callback is caught by the forward-auth
      # middleware itself and redirects to the login page forever.
      traefik.http.routers.jellyseerr-outpost.rule: Host(`jellyseerr.ghoulhub.uk`) && PathPrefix(`/outpost.goauthentik.io/`)
      traefik.http.routers.jellyseerr-outpost.entrypoints: "websecure"
      traefik.http.routers.jellyseerr-outpost.tls: "true"
      traefik.http.routers.jellyseerr-outpost.tls.certresolver: "le"
      traefik.http.routers.jellyseerr-outpost.priority: "15"
      traefik.http.routers.jellyseerr-outpost.service: "authentik-outpost"
      traefik.http.routers.jellyseerr-outpost.middlewares: "security-headers,rate-limit"
    restart: unless-stopped
    networks:
      - media-net
      - proxy

  suggestarr:
    image: ciuse99/suggestarr:latest
    container_name: suggestarr
    # LAN reachable on purpose. You administer these from your phone and
    # laptop, and the Cloudflare tunnel deliberately does NOT route any of
    # them, so "LAN reachable" is the whole exposure: guests and IoT devices
    # on the home Wi-Fi can load the login page, nothing more. Every one of
    # these services requires its own credentials before showing any data.
    ports:
      - "${SUGGESTARR_PORT:-5001}:5000"
    volumes:
      - ./config/suggestarr:/app/config/config_files
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
      - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - media-net

  uptimekuma:
    image: louislam/uptime-kuma:latest
    container_name: uptimekuma
    volumes:
      - ./config/uptimekuma:/app/data
    # LAN reachable on purpose. You administer these from your phone and
    # laptop, and the Cloudflare tunnel deliberately does NOT route any of
    # them, so "LAN reachable" is the whole exposure: guests and IoT devices
    # on the home Wi-Fi can load the login page, nothing more. Every one of
    # these services requires its own credentials before showing any data.
    ports:
      - "${UPTIMEKUMA_PORT:-3001}:3001"
    restart: unless-stopped
    networks:
      - media-net

networks:
  media-net:
    driver: bridge
  # Created by ../bootstrap.sh. Lets an app be published through Traefik without
  # ever binding a host port.
  proxy:
    external: true

# ─────────────────────────────────────────────────────────────────────────────
# Why Jellyfin has no Authentik gate, even though every other app here does
# ─────────────────────────────────────────────────────────────────────────────
#
# Jellyfin 12.1.0 authenticates every single request with its own token:
#
#     Authorization: MediaBrowser Client="...", Device="...", Token="..."
#
# Native clients (Samsung TV, Android TV, Apple TV, iOS, Android, Roku) and the
# browser web UI alike send that header and NO session cookie. A forward-auth
# gate can only answer "does this browser session pass?", so it would 302 the
# login page but then 302 every single API call once logged in — playback would
# never start on any device. Verified rather than assumed:
#
#     GET /Users/Me  with only a fake authentik_proxy cookie  -> 401
#     GET /Users/Me  with no credentials                      -> 401
#
# So this is not "auth not implemented yet". It is a property of Jellyfin's
# protocol. The options were:
#
#   1. A community SSO plugin that teaches Jellyfin about Authentik. There are
#      none installed, they lag server releases, and pinning them would mean
#      rebuilding the image on every Jellyfin upgrade — a fragile dependency
#      for a media server that must not break.
#   2. Separate hostnames: native clients ungated, web UI gated. Sounds right
#      but does not work, for the reason above — the web UI is a native client
#      too once it has a token.
#   3. Keep Jellyfin's own authentication, and put the real work into
#      compensating controls. This is what is done.
#
# Jellyfin is therefore classified Type C, not Type A, which the architecture
# allows for exactly this kind of case. What still protects it:
#
#   - Traefik is the only ingress: no host port, so nothing reaches Jellyfin
#     without TLS, the security headers and the rate limit.
#   - Cloudflare sits in front of that, so the origin IP is never published
#     and the only public entry point is proxied HTTPS.
#   - The rate limit is the real protection here: Jellyfin has no brute-force
#     lockout, and password guessing is the one attack that remains possible.
#   - Jellyfin's own admin password must be long and unique. Its API keys and
#     device tokens are stored hashed in ./config/jellyfin, which Kopia backs up.
#
# Re-check this decision if Jellyfin ever ships first-party OIDC/SAML.
